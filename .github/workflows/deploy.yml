name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types:
      - completed

  workflow_dispatch:

jobs:
  deploy:
    # Деплоим только если CI завершился успешно
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload project via rsync
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete --exclude=".git" --exclude=".venv" --exclude="__pycache__" --exclude=".pytest_cache"
          path: ./
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy with Docker Compose (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            if [ ! -f .env ]; then
              echo ".env not found in deploy path. Create it from .env.example and try again."
              exit 1
            fi

            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps